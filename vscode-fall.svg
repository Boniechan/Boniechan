<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" role="img" aria-labelledby="title">
  <title id="title">Visual Studio Code icon falling through code</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111827" />
      <stop offset="1" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#42a5f5" />
      <stop offset="1" stop-color="#0877d1" />
    </linearGradient>
  </defs>
  <rect width="360" height="180" rx="18" fill="url(#bg)" />
  <g fill="#8b9bb4" font-family="monospace" font-size="12" opacity=".5">
    <text x="24" y="36">const build = () =&gt; {</text>
    <text x="48" y="58">return 'something useful';</text>
    <text x="24" y="80">};</text>
    <text x="214" y="116">git commit -m "ship it"</text>
    <text x="214" y="138">npm run build</text>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -8; 0 42; 0 112; 0 180" keyTimes="0; .22; .72; 1" dur="2.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.76;1" dur="2.2s" repeatCount="indefinite" />
    <g transform="translate(138 0)">
      <rect x="-7" y="-7" width="98" height="98" rx="21" fill="#0b1220" opacity=".45" />
      <path d="M61 7 29 37 15 27 6 35l18 15L6 65l9 8 14-10 32 30 25-11V18L61 7Zm-1 18v44L37 50l23-25Z" fill="url(#blue)" />
      <path d="m29 37 8 13-8 13-9-7 10-6-10-6 9-7Z" fill="#75beff" />
    </g>
  </g>
</svg>
